# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

stages:
  - ".pre"
  - build
  - test
  - test-db
  - test-units
  - test-e2e
  - lint
  - audit
  - scan-dependencies
  - build-images
  - scan-images

image: ${DOCKER_HUB_PROXY}${BASE_IMAGE}

# A push to a branch other than develop, main or a merge queue branch starts no pipeline
# (#2218). A pull request against develop has a pipeline of its own (external_pull_request_event)
# that tests the same commit, e2e included, and it is the one GitHub requires. The push pipeline
# beside it ran the fast jobs a second time and held up the merge queue: GitLab starts a
# project's jobs in the order they were created, and the one runner is shared. Without it, a pull
# request whose own pipeline was not created gets no status at all instead of a green one without
# e2e. A merge queue branch (gh-readonly-queue/develop/…) keeps its push pipeline, it has no
# other. "Run pipeline" on GitLab still starts a branch pipeline by hand.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" &&
          $CI_COMMIT_BRANCH &&
          $CI_COMMIT_BRANCH != "develop" &&
          $CI_COMMIT_BRANCH != "main" &&
          $CI_COMMIT_BRANCH !~ /^gh-readonly-queue\//
      when: never
    - when: always

# A job that dies as runner_system_failure on its image pull, with an HTTP 404
# from the HU dependency proxy and before any of our code has run, is not flaky
# infrastructure: the proxy rejects every pull made as the project's bot account
# (#1611). A pipeline started when a pull request is opened can run as the owner
# of the token in the GitHub webhook (.../projects/6559/mirror/pull), pipelines
# for pushes run as the pull-mirror user; neither may be the bot. An automatic
# retry runs as the same account and cannot help there. Retries stay for failure
# classes that are infrastructure by definition -- a red test or lint job is
# NEVER retried, those reasons are script_failure.
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure

variables:
  REGISTRY: "${CI_REGISTRY}"
  REGISTRY_USER: "${CI_REGISTRY_USER}"
  REGISTRY_PASSWORD: "${CI_REGISTRY_PASSWORD}"
  REGISTRY_PROJECT: "/${CI_PROJECT_PATH}/"
  DOCKER_HUB_PROXY: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/"
  BASE_IMAGE: node:lts-bookworm-slim
  CICD_BASE_IMAGE: "${BASE_IMAGE}-git"
  CYPRESS_IMAGE: cypress/browsers:node-22.14.0-chrome-134.0.6998.165-1-ff-136.0.3-edge-134.0.3124.85-1
  CYPRESS_CACHE_FOLDER: "${CI_PROJECT_DIR}/cache/Cypress"
  E2E_BASE_IMAGE: "${CYPRESS_IMAGE}-docker"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DAEMON_OPTIONS: "--mtu=${DOCKER_SERVICE_MTU}"
  DOCKER_IMAGE: ${DOCKER_HUB_PROXY}docker:28
  DOCKER_SERVICE: ${DOCKER_HUB_PROXY}docker:28-dind
  DOCKER_SERVICE_MTU: 1392
  DOCKER_TLS_CERTDIR: ''
  TRAEFIK_BASE_IMAGE: ${DOCKER_HUB_PROXY}traefik:v3.7
  TRIVY_IMAGE: ${DOCKER_HUB_PROXY}aquasec/trivy:latest
  PRERELEASE_SCRIPT_REGEX: ^(0|([1-9][0-9]*))\.(0|([1-9][0-9]*))\.(0|([1-9][0-9]*))(-((alpha|beta|rc)((\.)?([1-9][0-9]*))?))$
  PRERELEASE_RULES_REGEX: /^(0|([1-9][0-9]*))\.(0|([1-9][0-9]*))\.(0|([1-9][0-9]*))(-((alpha|beta|rc)((\.)?([1-9][0-9]*))?))$/
  RELEASE_SCRIPT_REGEX: ^((0|([1-9][0-9]*)))\.((0|([1-9][0-9]*)))\.((0|([1-9][0-9]*)))$
  RELEASE_RULES_REGEX: /^((0|([1-9][0-9]*)))\.((0|([1-9][0-9]*)))\.((0|([1-9][0-9]*)))$/

include:
  - local: ".gitlab-ci/*.gitlab-ci.yml"
  #- template: Jobs/Dependency-Scanning.gitlab-ci.yml        # commits
  - template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml # pull requests

check-config:
  stage: ".pre"
  interruptible: true
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "external_pull_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - node --version
    - npm --version
    - echo ${CI_PIPELINE_SOURCE}
    - echo ${CI_REGISTRY}
    - echo ${CI_REGISTRY_IMAGE}
    - echo ${CI_DEPENDENCY_PROXY_SERVER}
    - echo ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}
    - echo ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}
    - echo ${CI_PROJECT_PATH}
    - echo ${CI_DEFAULT_BRANCH}
    - echo ${CI_COMMIT_BRANCH}
    - echo ${CI_COMMIT_TAG}
    - echo ${CI_COMMIT_BEFORE_SHA}
    - echo ${CI_COMMIT_SHA}
    - echo ${CI_COMMIT_SHORT_SHA}
    - echo ${CI_COMMIT_REF_NAME}
    - echo ${CI_COMMIT_REF_SLUG}
    - echo ${CI_COMMIT_REF_PROTECTED}
    - echo ${CI_EXTERNAL_PULL_REQUEST_IID}
    - echo ${CI_EXTERNAL_PULL_REQUEST_SOURCE_REPOSITORY}
    - echo ${CI_EXTERNAL_PULL_REQUEST_TARGET_REPOSITORY}
    - echo ${CI_EXTERNAL_PULL_REQUEST_SOURCE_BRANCH_NAME}
    - echo ${CI_EXTERNAL_PULL_REQUEST_SOURCE_BRANCH_SHA}
    - echo ${CI_EXTERNAL_PULL_REQUEST_TARGET_BRANCH_NAME}
    - echo ${CI_EXTERNAL_PULL_REQUEST_TARGET_BRANCH_SHA}
    - echo ${CI_MERGE_REQUEST_IID}
    - echo ${CI_MERGE_REQUEST_LABELS}
    - echo ${CI_MERGE_REQUEST_EVENT_TYPE}
    - echo ${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}
    - echo ${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA}
    - echo ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}
    - echo ${CI_MERGE_REQUEST_TARGET_BRANCH_SHA}

gemnasium-dependency_scanning:
    stage: scan-dependencies
    interruptible: true
    allow_failure: true
    rules:
      - if: $CI_EXTERNAL_PULL_REQUEST_TARGET_BRANCH_NAME == "develop"
      - if: $CI_EXTERNAL_PULL_REQUEST_TARGET_BRANCH_NAME == "main"
      - when: never
    needs: []
