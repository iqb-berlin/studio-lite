x-env-postgres: &env-postgres
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

services:
  # Asked by Traefik about every request to the frontend and the backend (ForwardAuth): every save,
  # login and API read has to come from a person (config/iqb-gate/gate.yaml). Traefik passes the
  # request on itself; the gateway sees its headers only. Image and Traefik are set per environment.
  iqb-gate:
    environment:
      IQB_GATE_FORWARD_AUTH: "on"
      IQB_GATE_CONFIG: /etc/iqb-gate/gate.yaml
      IQB_GATE_ENFORCE: ${IQB_GATE_ENFORCE:-on}
      IQB_GATE_RULES_OFF: ${IQB_GATE_RULES_OFF:-}
      IQB_GATE_READ_RULES_OFF: ${IQB_GATE_READ_RULES_OFF:-}
      IQB_GATE_SECRET: ${IQB_GATE_SECRET:-}
      IQB_GATE_AUDIT_KEY: ${IQB_GATE_AUDIT_KEY:-}
      IQB_GATE_TRUST_PROXY: ${IQB_GATE_TRUST_PROXY:-}
    volumes:
      - "./config/iqb-gate/gate.yaml:/etc/iqb-gate/gate.yaml:ro"
      - "iqb_gate_vol:/var/lib/iqb-gate"
    networks:
      application-network:
        # The name Traefik's middleware asks for: studio-lite's own, as other applications on app-net
        # may run a gateway of their own
        aliases:
          - studio-lite-iqb-gate

  frontend:
    depends_on:
      db:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - application-network

  backend:
    depends_on:
      db:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    environment:
      API_HOST: backend
      JWT_SECRET: ${JWT_SECRET}
      <<: *env-postgres
    networks:
      - application-network

  liquibase:
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *env-postgres
    command: [
      "liquibase",
      "--url=jdbc:postgresql://db:5432/$POSTGRES_DB",
      "--username=$POSTGRES_USER",
      "--password=$POSTGRES_PASSWORD",
      "--classpath=changelog",
      "--changeLogFile=studio-lite.changelog-root.xml",
      "update"
    ]
    networks:
      - application-network

  db:
    environment:
      <<: *env-postgres
    volumes:
      - "${DB_VOL:-db_vol}:/var/lib/postgresql/data"
    networks:
      - application-network

volumes:
  backend_vol:
  iqb_gate_vol:
  db_vol:
  db_external_vol:
    driver: local
    driver_opts:
      device: ${DB_EXTERNAL_VOL_PATH}
      o: bind
      type: none

networks:
  application-network:
    name: app-net
    external: true
