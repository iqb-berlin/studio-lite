@if (isLoading) {
  <mat-spinner class="spinner"></mat-spinner>
}
@if (!isLoading && !isError) {
  <div>
    <form class="fx-column-start-stretch" >
      <!-- Every registry entry is one profile: a panel heading would only repeat its name (#1549) -->
      @for (collection of profileStoresWithProfiles; track collection) {
        @for (profile of collection.profiles; track profile) {
          <div class="profile">
            <mat-checkbox
              [id]="profile.id"
              [checked]="profile.id | isProfileSelected:profilesSelected"
              (change)="changeSelection($event)"
              [name]="profile | profileLabel"
              data-cy="shared-profiles-select-profile">
              {{profile | profileLabel}}
            </mat-checkbox>
          </div>
        }
      }
    </form>
  </div>
}
@if (isError) {
  <mat-error>
    {{'metadata.error-fetching-metadata-profiles' | translate}}
  </mat-error>
}
