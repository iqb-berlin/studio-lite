<div class="unit-host"
  [class.with-footer]="reviewService.bookletConfig.pageNaviButtons !== 'OFF'">
  <div class="fx-row-start-stretch full-height">
    @if (message) {
      <div class="message">
        {{message}}
      </div>
    }
    <iframe #hostingIframe studioLiteTrackIframeActivity
    class="unitHost fx-flex-fill"></iframe>
    @if (reviewService.reviewConfig.showMetadata ||
      reviewService.reviewConfig.showCoding ||
      reviewService.reviewConfig.showOthersComments) {
      <studio-lite-unit-info
        [unitId]="reviewService.currentUnitSequenceId"
        [unitProperties]="unitData.dbMetadata">
      </studio-lite-unit-info>
    }
  </div>

  <!-- An unset pageNaviButtons means its default, SEPARATE_BOTTOM: the player falls back to the
       separate paging mode then and offers no navigation of its own (#1800). -->
  @if (reviewService.bookletConfig.pageNaviButtons !== 'OFF') {
    <div class="page-navigation fx-row-end-center">
      <studio-lite-page-navigation [pageList]="pageList"
                                   (gotoPage)="gotoPage($event)">
      </studio-lite-page-navigation>
    </div>
  }
</div>
