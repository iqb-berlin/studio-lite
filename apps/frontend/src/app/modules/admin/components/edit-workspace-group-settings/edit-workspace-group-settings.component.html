<h3 mat-dialog-title>{{'metadata.assign-metadata-profiles' | translate}}</h3>
<mat-dialog-content class="profiles">
  @if (profilesLoad() === 'failed') {
    <p data-cy="admin-edit-workspace-group-settings-not-loaded">{{'admin.group-profiles-not-loaded' | translate}}</p>
  } @else {
    <studio-lite-profiles [profiles] ="formData.profilesSelected"
                          [title]="'metadata.assign-metadata-profiles' | translate"
                          (hasChanged) ="hasChanged($event)"/>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button
          color="primary"
          type="submit"
          [disabled]="profilesLoad() !== 'loaded'"
          [mat-dialog-close]="this.formData"
          data-cy="admin-edit-workspace-group-settings-save-button">
    {{'save' | translate}}
  </button>
  <button mat-raised-button
          [mat-dialog-close]="false">
    {{'cancel' | translate}}
  </button>
</mat-dialog-actions>
