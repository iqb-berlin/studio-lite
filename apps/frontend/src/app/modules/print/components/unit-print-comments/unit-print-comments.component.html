@let threads = comments | rootCommentsWithReplies;
@if (!threads.length) {
  <h3>{{'print.no-comments' | translate}}</h3>
} @else {
  <h3>{{'print.comments' | translate}}</h3>
}
@for (thread of threads; track thread.rootComment.id; let first = $first) {
  <studio-lite-unit-print-comment
    [comment]="thread.rootComment"
    [metadata]="metadata"
    [divided]="!first">
  </studio-lite-unit-print-comment>
  @for (reply of thread.replies; track reply.id) {
    <studio-lite-unit-print-comment
      [comment]="reply"
      [metadata]="metadata"
      [isReply]="true">
    </studio-lite-unit-print-comment>
  }
}
