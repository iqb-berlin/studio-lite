# The specs and the Cypress config of the working tree, read-only: what Cypress writes as root stays
# in the container (#1790). The translations stay the image's, built with the frontend under test.
x-e2e-volumes: &e2e-volumes
  - "./apps/frontend-e2e/src:/usr/src/studio-lite/apps/frontend-e2e/src:ro"
  - "./apps/frontend-e2e/cypress.config.ts:/usr/src/studio-lite/apps/frontend-e2e/cypress.config.ts:ro"

services:
  test-e2e:
    image: ${REGISTRY_PATH}iqbberlin/studio-lite-frontend-e2e:${TAG}
    command:
      - "e2e"
      - "frontend-e2e"
      - "--baseUrl=http://frontend:8080"
      - "--browser=chrome"
    volumes: *e2e-volumes
    networks:
      - application-network

  test-e2e-electron:
    image: ${REGISTRY_PATH}iqbberlin/studio-lite-frontend-e2e:${TAG}
    command:
      - "e2e"
      - "frontend-e2e"
      - "--baseUrl=http://frontend:8080"
    volumes: *e2e-volumes
    networks:
      - application-network

  test-e2e-api:
    image: ${REGISTRY_PATH}iqbberlin/studio-lite-frontend-e2e:${TAG}
    command:
      - "e2e"
      - "frontend-e2e"
      - "--baseUrl=http://frontend:8080"
      - "--browser=chrome"
      - "--spec=\"./apps/frontend-e2e/src/e2e/api/**/*\""
    volumes: *e2e-volumes
    networks:
      - application-network

  test-e2e-ui-chrome:
    image: ${REGISTRY_PATH}iqbberlin/studio-lite-frontend-e2e:${TAG}
    command:
      - "e2e"
      - "frontend-e2e"
      - "--baseUrl=http://frontend:8080"
      - "--browser=chrome"
      - "--spec=\"./apps/frontend-e2e/src/e2e/ui/**/*\""
    volumes: *e2e-volumes
    networks:
      - application-network

  test-e2e-ui-workspace-chrome:
    image: ${REGISTRY_PATH}iqbberlin/studio-lite-frontend-e2e:${TAG}
    command:
      - "e2e"
      - "frontend-e2e"
      - "--baseUrl=http://frontend:8080"
      - "--browser=chrome"
      - "--spec=\"./apps/frontend-e2e/src/e2e/ui/workspace/**/*\""
    volumes: *e2e-volumes
    networks:
      - application-network

  test-e2e-ui-admin-chrome:
    image: ${REGISTRY_PATH}iqbberlin/studio-lite-frontend-e2e:${TAG}
    command:
      - "e2e"
      - "frontend-e2e"
      - "--baseUrl=http://frontend:8080"
      - "--browser=chrome"
      - "--spec=\"./apps/frontend-e2e/src/e2e/ui/**/*\""
      - "--excludeSpecPattern=\"**/ui/workspace/**\""
    volumes: *e2e-volumes
    networks:
      - application-network

  test-e2e-ui-chrome-mobile:
    image: ${REGISTRY_PATH}iqbberlin/studio-lite-frontend-e2e:${TAG}
    command:
      - "e2e"
      - "frontend-e2e"
      - "--baseUrl=http://frontend:8080"
      - "--browser=chrome"
      - "--spec=\"./apps/frontend-e2e/src/e2e/ui/**/*\""
      - "--config=\"viewportWidth=375,viewportHeight=667\""
    volumes: *e2e-volumes
    networks:
      - application-network

  test-e2e-ui-firefox:
    image: ${REGISTRY_PATH}iqbberlin/studio-lite-frontend-e2e:${TAG}
    command:
      - "e2e"
      - "frontend-e2e"
      - "--baseUrl=http://frontend:8080"
      - "--browser=firefox"
      - "--spec=\"./apps/frontend-e2e/src/e2e/ui/**/*\""
    volumes: *e2e-volumes
    networks:
      - application-network

  test-e2e-ui-firefox-mobile:
    image: ${REGISTRY_PATH}iqbberlin/studio-lite-frontend-e2e:${TAG}
    command:
      - "e2e"
      - "frontend-e2e"
      - "--baseUrl=http://frontend:8080"
      - "--browser=firefox"
      - "--spec=\"./apps/frontend-e2e/src/e2e/ui/**/*\""
      - "--config=\"viewportWidth=375,viewportHeight=667\""
    volumes: *e2e-volumes
    networks:
      - application-network

  test-e2e-ui-edge:
    image: ${REGISTRY_PATH}iqbberlin/studio-lite-frontend-e2e:${TAG}
    command:
      - "e2e"
      - "frontend-e2e"
      - "--baseUrl=http://frontend:8080"
      - "--browser=edge"
      - "--spec=\"./apps/frontend-e2e/src/e2e/ui/**/*\""
    volumes: *e2e-volumes
    networks:
      - application-network

  test-e2e-ui-edge-mobile:
    image: ${REGISTRY_PATH}iqbberlin/studio-lite-frontend-e2e:${TAG}
    command:
      - "e2e"
      - "frontend-e2e"
      - "--baseUrl=http://frontend:8080"
      - "--browser=edge"
      - "--spec=\"./apps/frontend-e2e/src/e2e/ui/**/*\""
      - "--config=\"viewportWidth=375,viewportHeight=667\""
    volumes: *e2e-volumes
    networks:
      - application-network

networks:
  application-network:
    name: app-net
    external: true
